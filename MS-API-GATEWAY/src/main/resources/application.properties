spring.application.name=MS-API-GATEWAY
server.port=8000

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register Gateway with Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#################################################
# Route 1 : Addition Service
#################################################

spring.cloud.gateway.server.webflux.routes[0].id=MS1
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MS1
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/ms1/**

spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=ms1CB
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/ms1

#################################################
# Route 2 : Multiplication Service
#################################################

spring.cloud.gateway.server.webflux.routes[1].id=ms-course
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ms-course
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/course/**

spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=COURSECB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/course


#################################################
# Route 2 : Multiplication Service
#################################################

spring.cloud.gateway.server.webflux.routes[2].id=ms-enrol
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ms-enrol
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/enrolment/**

spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=enrolCB
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/enrolment

#################################################
# Route 2 : Multiplication Service
#################################################

spring.cloud.gateway.server.webflux.routes[3].id=ms-enrol
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ms-payment
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payment/**

spring.cloud.gateway.server.webflux.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.name=paymentCB
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.fallbackUri=forward:/fallback/payment
